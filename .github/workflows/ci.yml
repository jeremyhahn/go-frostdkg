# ci-template: v1 — canonical CI for all first-party Go repos.
# Source of truth: software/templates/github-actions/ci.yml in the
# automatethethings repo. Copied into each repo (never workflow_call: the
# template lives inside the security boundary and cannot be referenced from
# github.com). Blocks marked CUSTOMIZE are the only expected divergence;
# everything else drifting from the template is a defect (devops.md §8).
#
# Runs identically on Gitea Actions (dev) and GitHub Actions (public mirror);
# host-specific steps are guarded on github.server_url (devops.md §1).

name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  # Re-run by hand without an empty commit. The shared runner host is
  # occasionally saturated enough that a job is starved out with no output at
  # all, and this Gitea build exposes no rerun API (devops.md §5).
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  GO_VERSION: "1.26.6"        # latest stable — bumped portfolio-wide (devops.md §9)
  COVERAGE_THRESHOLD: 60      # CUSTOMIZE: matches COVERAGE_THRESHOLD in the Makefile
  # No GOPROXY/GOSUMDB overrides here on purpose. The runner injects
  # GOPRIVATE=github.com/jeremyhahn/* plus the tokenised GIT_CONFIG rewrite to
  # Gitea, which already exempts first-party modules from both the proxy and
  # the checksum database. Setting GOSUMDB=off at the workflow level would
  # disable checksum verification for every THIRD-party dependency too — that
  # is how a retagged upstream slipped past verification in go-quicbaas.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "${UNFORMATTED}" ]; then
            echo "Files not formatted:"; echo "${UNFORMATTED}"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Installed from source rather than pinned to a release binary: a pinned
      # golangci-lint built with an older Go refuses a newer go.mod outright
      # ("the Go language version used to build golangci-lint is lower than the
      # targeted Go version"), which is how v2.7.2 broke this job against
      # go 1.26.6. Building with the job's own toolchain cannot drift.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      # .golangci.yml must enable staticcheck, errcheck, unused, ineffassign,
      # misspell, gocritic (devops.md §8) — the umbrella with the security
      # linters off does not satisfy the gate.
      - name: golangci-lint
        run: golangci-lint run --timeout=5m ./...

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      # CUSTOMIZE (with justification): every -exclude rule below was checked
      # against the code; keep this list identical to GOSEC_EXCLUDE in the
      # Makefile.
      #   G115 integer overflow on conversion: every flagged site is a
      #        deliberate narrowing to byte — the big-endian serialization
      #        idiom (byte(v >> 24), …) in pkg/dkg, and byte(participantIdx)
      #        where the index is a small ordinal bounded by the DKG group
      #        size. NOT a blanket "we accept overflow": a NEW narrowing
      #        conversion without a preceding bound is a real finding this
      #        exclusion will hide, so review them by hand.
      #   G118 goroutine with context.Background/TODO: the single site is the
      #        QUIC accept loop, which outlives the Start call that spawns it
      #        and is terminated by Stop through shutdownChan. Binding it to
      #        the caller's start-up context would cancel the listener.
      # -stdout -verbose=text alongside the SARIF file (ci-template v1.1): with
      # `-fmt sarif -out` alone the findings go only into the artifact, and on
      # Gitea — which has no code-scanning API to upload it to — a failure
      # prints nothing at all in the job log.
      - name: Run gosec
        run: |
          gosec -exclude=G115,G118 \
            -exclude-generated \
            -severity medium \
            -confidence medium \
            -exclude-dir=test -exclude-dir=vendor \
            -fmt sarif -out gosec.sarif -stdout -verbose=text ./...

      - name: Upload gosec SARIF
        # Gitea has no code-scanning API; the upload 404s and fails the job.
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: gosec.sarif
          category: gosec

      # CUSTOMIZE: calls the Makefile target so the no-fix allowlist lives in
      # exactly one place (devops.md §4) and a new, fixable vulnerability fails
      # the build instead of being swallowed by a blanket ignore. Also the
      # toolchain-currency forcing function (devops.md §9).
      - name: Run govulncheck
        run: make vulncheck

      - name: Verify module integrity
        run: go mod verify

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # CUSTOMIZE: skip-dirs — the integration harness under test/ only.
      - name: Trivy scan (SARIF for code scanning)
        # trivy-action's setup checks out aquasecurity/trivy from github.com
        # with the runner token, which a Gitea token cannot authenticate.
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: test

      - name: Upload Trivy SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          skip-dirs: test

      # Same gate on Gitea, via the trivy CLI installed from the release
      # tarball (anonymous download — no github.com auth involved).
      - name: Install Trivy (Gitea)
        if: github.server_url != 'https://github.com'
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy gate (Gitea)
        if: github.server_url != 'https://github.com'
        run: trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --format table --skip-dirs test .

  build:
    # CUSTOMIZE: this repo ships a cross-platform CLI, so the template's single
    # `go build ./...` is widened to the release target matrix. Written out
    # literally — Gitea does not expand a computed matrix (devops.md §1).
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: ''
          - goos: windows
            goarch: arm64
            ext: ''
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build all packages
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go build ./...

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=$(cat VERSION 2>/dev/null || echo "dev")
          GIT_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-X main.Version=${VERSION} -X main.GitCommit=${GIT_COMMIT} -X main.BuildTime=${BUILD_TIME}"
          mkdir -p bin
          EXT=''
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT='.exe'; fi
          go build -ldflags "${LDFLAGS}" -o "bin/frostdkg-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" ./cmd/frostdkg

      - name: Verify binary (linux/amd64 only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          ./bin/frostdkg-linux-amd64 --help
          ./bin/frostdkg-linux-amd64 version

      - name: Upload build artifacts
        # upload-artifact@v4+ refuses to run against a non-github.com server
        # ("not currently supported on GHES") and fails the job (devops.md §1).
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v6
        with:
          name: frostdkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/frostdkg-${{ matrix.goos }}-${{ matrix.goarch }}*
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, build]
    timeout-minutes: 30       # CUSTOMIZE: suite runs in ~1m; 30m is headroom
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # CUSTOMIZE: one job runs the race detector AND the coverage gate over
      # the same suite. They used to be three jobs (Unit Tests, Code Coverage,
      # Race Detector) all executing the identical suite concurrently on one
      # runner; because DefaultTransportFactory pins the libp2p coordinator to
      # a fixed 0.0.0.0:9000, two concurrent copies raced for that port and
      # whichever lost failed with "bind: address already in use". Running the
      # suite once removes the collision instead of retrying around it.
      #
      # test/integration is excluded here; it has its own job below.
      - name: Run tests with race detector and coverage
        run: |
          mkdir -p coverage
          PKGS=$(go list -f '{{if .TestGoFiles}}{{.ImportPath}}{{end}}' ./... | grep -v '/test/integration' | tr '\n' ' ')
          if [ -z "${PKGS}" ]; then echo "no packages with tests"; exit 1; fi
          go test -race -count=1 -timeout=900s -covermode=atomic -coverprofile=coverage/coverage.out ${PKGS}
          go tool cover -html=coverage/coverage.out -o coverage/coverage.html
          COVERAGE=$(go tool cover -func=coverage/coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          # Assert the value parsed before comparing it. An empty COVERAGE made
          # the old `[ $(echo "... < N" | bc -l) -eq 1 ]` form emit "unary
          # operator expected" and return non-zero, which for an `if` CONDITION
          # is not fatal under `bash -e` — the threshold was silently skipped.
          # awk also drops the dependency on bc being installed on the runner.
          case "${COVERAGE}" in
            ''|*[!0-9.]*) echo "FAIL: could not parse coverage from coverage/coverage.out"; exit 1 ;;
          esac
          if awk -v c="${COVERAGE}" -v t="${{ env.COVERAGE_THRESHOLD }}" 'BEGIN{exit !(c+0 < t+0)}'; then
            echo "FAIL: coverage ${COVERAGE}% is below minimum ${{ env.COVERAGE_THRESHOLD }}%"
            exit 1
          fi

      - name: Upload coverage reports
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports
          path: |
            coverage/coverage.html
            coverage/coverage.out
          retention-days: 30

      - name: Upload coverage to Codecov
        if: github.server_url == 'https://github.com'
        uses: codecov/codecov-action@v6
        continue-on-error: true
        with:
          files: ./coverage/coverage.out
          flags: unittests
          name: go-frostdkg-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Restored 2026-08-14, with the blockers that kept both jobs out now fixed:
  # the QUIC helpers share one ephemeral CA so clients can verify the server
  # (pkg/transport/quic/testpki_test.go), and the image build resolves
  # first-party modules through a BuildKit secret (test/integration/Dockerfile).
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    # needs: [test] is load-bearing, not ordering taste. This suite and the unit
    # suite both stand up a libp2p coordinator, and DefaultTransportFactory pins
    # it to a fixed 0.0.0.0:9000; the runner gives job containers the HOST
    # network namespace, so two of them in flight at once collide with "bind:
    # address already in use". That is the same collision the Test job above was
    # collapsed into one job to avoid — running after it keeps the fix intact
    # rather than reintroducing the race from a second direction.
    needs: [test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run integration tests
        run: go test -race -count=1 -timeout=300s -tags=integration ./...

  docker:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest
    needs: [build, integration-test]
    steps:
      - uses: actions/checkout@v6

      # go.mod pins first-party modules published to the internal Gitea, which
      # `go mod download` inside the image cannot reach on its own. The runner
      # injects GOPRIVATE and the tokenised insteadOf rewrite into this job's
      # environment (dependency-resolution.md §6), but a job environment does
      # not cross into a docker build — hence handing it over explicitly.
      #
      # Written under RUNNER_TEMP, deliberately OUTSIDE the build context: the
      # Dockerfile ends with `COPY . .`, so a credentials file inside the
      # workspace would be baked into a layer. .dockerignore lists gomodauth* as
      # a second line of defence. The file is a BuildKit secret, never a build
      # arg — an arg is recoverable with `docker history`.
      #
      # On GitHub none of these variables exist, the file is written empty, and
      # the Dockerfile's mount is optional, so the same build works there
      # against the public proxy.
      # The variables are read straight from the shell environment, NOT through
      # ${{ env.X }} — that expression reads this workflow's `env:` block, which
      # does not define them, and would quietly write blanks. The runner puts
      # them in the job container's process environment.
      - name: Stage module-fetch credentials
        run: |
          set -eu
          umask 077
          : > "${RUNNER_TEMP}/gomodauth.env"
          if [ -n "${GIT_CONFIG_KEY_0:-}" ]; then
            {
              printf 'export GOPRIVATE=%s\n' "${GOPRIVATE:-}"
              printf 'export GIT_CONFIG_COUNT=%s\n' "${GIT_CONFIG_COUNT:-}"
              printf 'export GIT_CONFIG_KEY_0=%s\n' "${GIT_CONFIG_KEY_0}"
              printf 'export GIT_CONFIG_VALUE_0=%s\n' "${GIT_CONFIG_VALUE_0:-}"
            } > "${RUNNER_TEMP}/gomodauth.env"
            echo "staged Gitea module credentials"
          else
            echo "no Gitea credentials in this environment; resolving from the public proxy"
          fi

      - name: Build integration image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --secret id=gomodauth,src="${RUNNER_TEMP}/gomodauth.env" \
            -f test/integration/Dockerfile \
            -t go-frostdkg-test:ci-scan .

      - name: Remove staged credentials
        if: always()
        run: rm -f "${RUNNER_TEMP}/gomodauth.env"

      # THE GATE (devops.md §8): every image this repo builds is scanned and a
      # fixable CRITICAL/HIGH fails the job on both servers. --ignore-unfixed is
      # the 2026-08-14 ratification — an advisory with no released fix cannot be
      # actioned by rebuilding and would pin this gate permanently red.
      #
      # Trivy runs from its own image rather than aquasecurity/trivy-action,
      # whose setup does a nested checkout that a self-hosted runner resolves
      # against its own server and fails with git exit 128.
      - name: Trivy image gate (fail on fixable CRITICAL/HIGH)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
              --format table \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --exit-code 1 \
              --no-progress \
              go-frostdkg-test:ci-scan

      - name: Remove scanned image
        if: always()
        run: docker image rm -f go-frostdkg-test:ci-scan || true

  # The single required check (devops.md §1). Every job above must appear in
  # BOTH the needs list and the results check — a gate that can pass vacuously
  # is worse than no gate. Do not use join(needs.*.result); it evaluates empty
  # on Gitea and reports success while jobs fail.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, security, trivy, build, test, integration-test, docker]
    steps:
      - name: Fail closed on any non-success
        run: |
          check() { case "$2" in success) echo "OK   $1";; *) echo "FAIL $1 ($2)"; BAD=1;; esac; }
          BAD=0
          check lint             "${{ needs.lint.result }}"
          check security         "${{ needs.security.result }}"
          check trivy            "${{ needs.trivy.result }}"
          check build            "${{ needs.build.result }}"
          check test             "${{ needs.test.result }}"
          check integration-test "${{ needs.integration-test.result }}"
          check docker           "${{ needs.docker.result }}"
          exit $BAD
