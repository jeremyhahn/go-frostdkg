name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

env:
  GO_VERSION: '1.26.6'
  COVERAGE_THRESHOLD: 60
  GOPROXY: direct
  GOSUMDB: off

jobs:
  # Job 1: Unit Tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run unit tests
        run: |
          PKGS=$(go list -f '{{if .TestGoFiles}}{{.ImportPath}}{{end}}' ./... | grep -v '/test/integration' | tr '\n' ' ')
          if [ -n "$PKGS" ]; then
            go test -v -race -timeout 120s $PKGS
          fi

  # Job 1b: Coverage (Ubuntu only)
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests with coverage
        run: |
          mkdir -p coverage
          PKGS=$(go list -f '{{if .TestGoFiles}}{{.ImportPath}}{{end}}' ./... | grep -v '/test/integration' | tr '\n' ' ')
          if [ -n "$PKGS" ]; then
            go test -v -race -coverprofile=coverage/coverage.out -covermode=atomic -timeout 120s $PKGS
          fi
          go tool cover -html=coverage/coverage.out -o coverage/coverage.html

      - name: Calculate coverage
        id: coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage/coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "coverage=${COVERAGE}" >> $GITHUB_OUTPUT
          echo "Total coverage: ${COVERAGE}%"

      - name: Check coverage threshold
        run: |
          COVERAGE=${{ steps.coverage.outputs.coverage }}
          COVERAGE_INT=$(echo "${COVERAGE}" | awk '{printf "%d", $1}')
          if [ "${COVERAGE_INT}" -lt "${COVERAGE_THRESHOLD}" ]; then
            echo "Coverage ${COVERAGE}% is below threshold ${COVERAGE_THRESHOLD}%"
            exit 1
          else
            echo "Coverage ${COVERAGE}% meets threshold ${COVERAGE_THRESHOLD}%"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./coverage/coverage.out
          flags: unittests
          name: go-frostdkg-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage reports
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports
          path: |
            coverage/coverage.html
            coverage/coverage.out
          retention-days: 30

  # Job 2: Integration Tests
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test, coverage]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run integration tests
        run: go test -v -race -timeout 300s -tags=integration ./...
        timeout-minutes: 10

  # Job 3: Lint
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run gofmt check
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Code is not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.7.2
          args: --timeout=5m

  # Job 4: Security Scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      # Writes SARIF (uploaded below) and exits non-zero on findings to gate the
      # build — devops.md §8 makes gosec blocking, so continue-on-error is gone.
      #
      # Every -exclude rule below was checked against the code; the reason is
      # recorded here so the next person does not have to re-derive it. Keep
      # this list identical to GOSEC_EXCLUDE in the Makefile.
      #   G115 integer overflow on conversion: every flagged site is a
      #        deliberate narrowing to byte — the big-endian serialization
      #        idiom (byte(v >> 24), …) in pkg/dkg, and byte(participantIdx)
      #        where the index is a small ordinal bounded by the DKG group
      #        size. NOT a blanket "we accept overflow": a NEW narrowing
      #        conversion without a preceding bound is a real finding this
      #        exclusion will hide, so review them by hand.
      #   G118 goroutine with context.Background/TODO: the single site is the
      #        QUIC accept loop, which outlives the Start call that spawns it
      #        and is terminated by Stop through shutdownChan. Binding it to
      #        the caller's start-up context would cancel the listener.
      - name: Run gosec security scanner
        run: |
          gosec -exclude=G115,G118 \
            -exclude-generated \
            -severity medium \
            -confidence medium \
            -exclude-dir=test -exclude-dir=vendor \
            -fmt sarif -out gosec-results.sarif ./...

      - name: Upload gosec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: github.server_url == 'https://github.com'
        continue-on-error: true
        with:
          sarif_file: gosec-results.sarif
          category: gosec

      - name: Verify module integrity
        run: go mod verify

      # Calls the Makefile target so the no-fix allowlist lives in exactly one
      # place (devops.md §4) and a new, fixable vulnerability fails the build
      # instead of being swallowed by a blanket ignore.
      - name: Run govulncheck
        run: make vulncheck

  # devops.md §8: trivy fs gates dependency CVEs, leaked secrets and
  # misconfigurations in the tree on CRITICAL/HIGH, on both hosts.
  #
  # trivy-action downloads its setup from github.com and cannot authenticate
  # from a Gitea runner, and code-scanning SARIF upload is a GitHub-only
  # mechanic — both are guarded on github.server_url. The Gitea leg installs
  # the trivy CLI from the release tarball and runs the same gate, so neither
  # host is left unscanned.
  trivy:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Trivy scan (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: test

      - name: Upload Trivy SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          skip-dirs: test

      - name: Install trivy CLI (Gitea)
        if: github.server_url != 'https://github.com'
        run: |
          TRIVY_VERSION=$(curl -fsSL https://api.github.com/repos/aquasecurity/trivy/releases/latest \
            | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p')
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Trivy gate (Gitea)
        if: github.server_url != 'https://github.com'
        run: trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --skip-dirs test .

  # Job 5: Build (cross-platform)
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [test, lint]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
          - goos: windows
            goarch: arm64
            ext: '.exe'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=$(cat VERSION 2>/dev/null || echo "dev")
          GIT_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-X main.Version=${VERSION} -X main.GitCommit=${GIT_COMMIT} -X main.BuildTime=${BUILD_TIME}"
          mkdir -p bin
          go build -ldflags "${LDFLAGS}" -o bin/frostdkg-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/frostdkg

      - name: Verify build (Linux amd64 only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          ./bin/frostdkg-linux-amd64 --help
          ./bin/frostdkg-linux-amd64 version

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: frostdkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/frostdkg-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          retention-days: 7

  # Job 6: Race Detector
  race:
    name: Race Detector
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests with race detector
        run: |
          PKGS=$(go list -f '{{if .TestGoFiles}}{{.ImportPath}}{{end}}' ./... | grep -v '/test/integration' | tr '\n' ' ')
          if [ -n "$PKGS" ]; then
            go test -race -timeout 120s $PKGS
          fi

  # Job 7: Docker Build & Scan
  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: github.event_name == 'push'
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: test/integration/Dockerfile
          push: false
          load: true
          tags: go-frostdkg:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        if: github.server_url == 'https://github.com'
        with:
          image-ref: go-frostdkg:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: 0

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: github.server_url == 'https://github.com'
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # devops.md §8: the image scan gates, it does not merely report. The CLI
      # runs the gate on both hosts — trivy-action's setup cannot authenticate
      # to github.com from a Gitea runner.
      - name: Install trivy CLI
        run: |
          TRIVY_VERSION=$(curl -fsSL https://api.github.com/repos/aquasecurity/trivy/releases/latest \
            | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p')
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Trivy image gate (fail on CRITICAL/HIGH)
        run: trivy image --scanners vuln --severity CRITICAL,HIGH --exit-code 1 go-frostdkg:${{ github.sha }}
