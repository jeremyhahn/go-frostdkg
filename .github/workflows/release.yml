name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.26.6'
  # No hardcoded registry: ghcr.io does not exist on the internal network, and
  # Gitea's registry lives on the same host and port as its web UI. Both are
  # derived from github.server_url at run time (devops.md §2).
  IMAGE_NAME: jeremyhahn/frostdkg

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Generate changelog
        run: |
          PREV_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")
          VERSION=${{ steps.get_version.outputs.version }}
          if [ "${{ github.server_url }}" = "https://github.com" ]; then
            REGISTRY=ghcr.io
          else
            REGISTRY=$(echo '${{ github.server_url }}' | sed -E 's#^https?://##')
          fi

          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"* %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)" --no-merges)
          fi

          cat > CHANGELOG.md << EOF
          ## What's Changed

          ${CHANGELOG}

          ## Installation

          ### Binary Downloads
          - frostdkg-${VERSION}-linux-amd64
          - frostdkg-${VERSION}-linux-arm64
          - frostdkg-${VERSION}-darwin-amd64
          - frostdkg-${VERSION}-darwin-arm64
          - frostdkg-${VERSION}-windows-amd64.exe
          - frostdkg-${VERSION}-windows-arm64.exe

          ### Docker
          docker pull ${REGISTRY}/${{ env.IMAGE_NAME }}:${VERSION}
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.version, 'alpha') || contains(steps.get_version.outputs.version, 'beta') || contains(steps.get_version.outputs.version, 'rc') }}

  build-binaries:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
          - goos: windows
            goarch: arm64
            ext: '.exe'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          LDFLAGS="-X main.version=${VERSION} -X main.commit=${{ github.sha }} -s -w"
          mkdir -p dist
          go build -ldflags="${LDFLAGS}" -o dist/frostdkg${{ matrix.ext }} ./cmd/frostdkg

          BINARY_NAME="frostdkg-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          mv dist/frostdkg${{ matrix.ext }} "${BINARY_NAME}"
          sha256sum "${BINARY_NAME}" > "${BINARY_NAME}.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frostdkg-${{ needs.create-release.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
            frostdkg-${{ needs.create-release.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}.sha256

  build-docker:
    name: Build Docker Image
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ghcr.io on GitHub, Gitea's own registry (same host and port as its web
      # UI) on the internal network — derived, never hardcoded (devops.md §2).
      - name: Resolve registry
        id: registry
        run: |
          if [ "${{ github.server_url }}" = "https://github.com" ]; then
            echo "host=ghcr.io" >> $GITHUB_OUTPUT
          else
            echo "host=$(echo '${{ github.server_url }}' | sed -E 's#^https?://##')" >> $GITHUB_OUTPUT
          fi

      # continue-on-error for the same reason the push below has it, and it has
      # to be here too or the guard never gets a chance to work: Gitea's
      # registry is plain HTTP on :3001, and the docker daemon refuses it with
      # "server gave HTTP response to HTTPS client" unless every daemon
      # involved is configured as an insecure registry
      # (infra/gitea/docs/lessons.md). Login runs BEFORE the build, so an
      # unguarded failure here killed the whole job before the image was ever
      # built or scanned — which is what happened to the v0.2.0-alpha release.
      # Losing the image is annoying; losing the release over it would be
      # worse. The Trivy gate below is unaffected and stays blocking: it scans
      # a locally built image and needs no registry.
      - name: Log in to the registry
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registry.outputs.host }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      # Same reasoning as ci.yml's docker job: go.mod pins first-party modules
      # published to the internal Gitea, `go mod download` inside the image
      # cannot reach them on its own, and a job environment does not cross into
      # a docker build. Staged under RUNNER_TEMP, outside the build context,
      # because Dockerfile.release ends with `COPY . .`. Read from the shell
      # environment, NOT ${{ env.X }} — that reads this workflow's env: block
      # and would silently write blanks.
      - name: Stage module-fetch credentials
        run: |
          set -eu
          umask 077
          : > "${RUNNER_TEMP}/gomodauth.env"
          if [ -n "${GIT_CONFIG_KEY_0:-}" ]; then
            {
              printf 'export GOPRIVATE=%s\n' "${GOPRIVATE:-}"
              printf 'export GIT_CONFIG_COUNT=%s\n' "${GIT_CONFIG_COUNT:-}"
              printf 'export GIT_CONFIG_KEY_0=%s\n' "${GIT_CONFIG_KEY_0}"
              printf 'export GIT_CONFIG_VALUE_0=%s\n' "${GIT_CONFIG_VALUE_0:-}"
            } > "${RUNNER_TEMP}/gomodauth.env"
            echo "staged Gitea module credentials"
          else
            echo "no Gitea credentials in this environment; resolving from the public proxy"
          fi

      # buildx resolves secret-files paths in an expression context where
      # ${{ runner.temp }} can come back empty (dependency-resolution.md §6,
      # the go-recountly trap), so compute it in the shell and pass it on.
      - name: Resolve credentials path
        id: gomodauth
        run: echo "path=${RUNNER_TEMP}/gomodauth.env" >> "$GITHUB_OUTPUT"

      - name: Create Dockerfile
        run: |
          cat > Dockerfile.release << 'DOCKERFILE'
          # syntax=docker/dockerfile:1.7
          FROM golang:1.26.6-alpine AS builder
          RUN apk add --no-cache git ca-certificates
          WORKDIR /build
          COPY go.mod go.sum ./
          # Optional secret mount: sourced, never exported, so the token reaches
          # neither a layer, image metadata, nor a command line. Absent on
          # GitHub, where these modules resolve from the public proxy.
          RUN --mount=type=secret,id=gomodauth \
              set -eu; \
              if [ -f /run/secrets/gomodauth ]; then . /run/secrets/gomodauth; fi; \
              go mod download
          COPY . .
          ARG VERSION
          ARG COMMIT
          RUN CGO_ENABLED=0 go build \
              -ldflags="-X main.version=${VERSION} -X main.commit=${COMMIT} -s -w" \
              -o /build/frostdkg ./cmd/frostdkg

          FROM alpine:3.24
          RUN apk add --no-cache ca-certificates && adduser -D -u 1000 frostdkg
          COPY --from=builder /build/frostdkg /usr/local/bin/frostdkg
          USER frostdkg
          ENTRYPOINT ["/usr/local/bin/frostdkg"]
          DOCKERFILE

      # devops.md §8: every container image is gated on CRITICAL/HIGH *before*
      # it reaches a registry. Build the amd64 leg locally, scan it, then
      # publish the multi-arch manifest from the same layer cache.
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64
          push: false
          load: true
          tags: go-frostdkg:scan
          build-args: |
            VERSION=${{ needs.create-release.outputs.version }}
            COMMIT=${{ github.sha }}
          secret-files: |
            gomodauth=${{ steps.gomodauth.outputs.path }}
          cache-from: type=gha

      # The trivy CLI works identically on both hosts; trivy-action's setup
      # cannot authenticate to github.com from a Gitea runner.
      - name: Install trivy CLI
        run: |
          TRIVY_VERSION=$(curl -fsSL https://api.github.com/repos/aquasecurity/trivy/releases/latest \
            | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p')
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # --ignore-unfixed on the OS layer, ratified 2026-08-14 (devops.md §8):
      # base images carry hundreds of unfixable advisories at any given moment,
      # so a raw gate would be permanently red and would train people to ignore
      # it. This gate means "a rebuild fixes this" — actionable, so enforceable.
      - name: Trivy image gate (fail on fixable CRITICAL/HIGH)
        run: trivy image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 go-frostdkg:scan

      # The gate above is blocking; only the publish tolerates failure. Docker
      # refuses a plain-HTTP registry unless every daemon involved is told
      # otherwise, so on a host that has not been configured the push fails.
      # Losing the image is annoying; losing the release over it would be worse
      # (infra/gitea/docs/lessons.md).
      - name: Build and push
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.create-release.outputs.version }}
            COMMIT=${{ github.sha }}
          secret-files: |
            gomodauth=${{ steps.gomodauth.outputs.path }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Remove staged credentials
        if: always()
        run: rm -f "${RUNNER_TEMP}/gomodauth.env"

  create-checksums:
    name: Create Checksums
    needs: [create-release, build-binaries]
    runs-on: ubuntu-latest

    steps:
      - name: Download checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          gh release download ${TAG_NAME} --repo ${{ github.repository }} --pattern "*.sha256" --dir checksums || true

      # If the aggregate cannot be built, publish nothing rather than a
      # placeholder. The previous version wrote the literal string "No
      # checksums" into checksums.txt and uploaded it unconditionally — and on
      # Gitea that is the NORMAL outcome, because the `gh` above talks to
      # api.github.com and cannot see this release at all. v0.2.0-alpha shipped
      # exactly that: a 13-byte checksums.txt. For a threshold-signature
      # binary, an artifact that looks like a checksum manifest and is not one
      # is worse than an absent one.
      #
      # Nothing is lost by skipping it: build-binaries already publishes a
      # per-binary .sha256 next to every binary, and those are the
      # authoritative checksums. checksums.txt is only a convenience aggregate.
      - name: Create master checksums
        id: checksums
        run: |
          if [ -d checksums ] && [ -n "$(ls -A checksums 2>/dev/null)" ]; then
            cat checksums/*.sha256 > checksums.txt
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "No per-binary .sha256 files could be gathered; skipping the"
            echo "aggregate. The per-binary .sha256 release assets stand alone."
          fi

      - name: Upload checksums
        if: steps.checksums.outputs.have == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: checksums.txt
